semantic_model:
  entity_types:
    - id: TYPE-PUBLICATION
      label: Official publication or guidance record
      source_native_type: GOV.UK content-store document type
      proposed_class: schema:CreativeWork
      identity_key: Canonical GOV.UK route plus source content identifier when supplied.
      version_key: Preserve edition/publication timestamps; do not infer versions from titles.
      required_properties: [id, route, title, record_type, source, generated]
      optional_properties: [description, public_timestamp, organisations, language, related records]
      examples: [Practice guide, form, statistical data set, notice, corporate report]
      excluded_conflations: [A collection is not one of its member documents., A page route is not an attachment.]
      task_refs: [TASK-PUBLIC-ROUTE, TASK-PRACTICE, TASK-AUDIT]
      evidence_refs: [EV-GOVUK-SEARCH]
    - id: TYPE-DATASET
      label: Dataset
      source_native_type: HMLR dataset landing-page entry
      proposed_class: dcat:Dataset
      identity_key: Canonical publisher dataset URL and source slug.
      version_key: Source-native release or snapshot identity; landing-page dates remain separate.
      required_properties: [id, title, scope, publisher, source, access, rights, cadence]
      optional_properties: [distributions, temporal coverage, spatial coverage, technical specification]
      examples: [Price Paid Data, INSPIRE Index Polygons, Registered Leases]
      excluded_conflations: [Dataset is not distribution., Snapshot is not live register.]
      task_refs: [TASK-DATASET, TASK-SPATIAL, TASK-AUDIT]
      evidence_refs: [EV-ULPD]
    - id: TYPE-SERVICE
      label: Operational service or API product
      source_native_type: HMLR service or Business Gateway product
      proposed_class: dcat:DataService where a data service is evidenced
      identity_key: Canonical service or documentation URL plus source-native service name/version.
      version_key: Preserve protocol, schema version, environment and formal notice.
      required_properties: [id, title, source, access_model, operational_authority]
      optional_properties: [endpoint, protocol, authentication, documentation, schema, fees]
      examples: [Search for land and property information, Business Gateway API, LLC search]
      excluded_conflations: [Public documentation is not anonymous service access., Test and production endpoints are distinct.]
      task_refs: [TASK-PUBLIC-ROUTE, TASK-API, TASK-LLC]
      evidence_refs: [EV-BG-DOCS, EV-PROPERTY-SERVICE, EV-LLC-TERMS]
    - id: TYPE-REPOSITORY
      label: Public source-code repository
      source_native_type: GitHub repository
      proposed_class: schema:SoftwareSourceCode
      identity_key: GitHub repository full_name.
      version_key: Repository is mutable; commits and releases are separate identities.
      required_properties: [full_name, html_url, source, observed_at]
      optional_properties: [description, archived, fork, licence, pushed_at]
      examples: [LandRegistry/bgtechdoc]
      excluded_conflations: [Prototype code is not production policy., Missing licence is not permission.]
      task_refs: [TASK-API, TASK-AUDIT]
      evidence_refs: [EV-GITHUB]
  identifier_schemes:
    - id: IDSCHEME-GOVUK
      issuer: Government Digital Service
      syntax: Canonical GOV.UK route and source content identifier where supplied.
      scope: GOV.UK records attributed to HM Land Registry
      persistence: Routes can redirect; content identifiers are preferred when present.
      normalization: Preserve native values and add a deterministic route-safe local identifier.
      collision_policy: Fail closed when two source identities map to one local route.
      uri_policy: Resolve local IDs under https://chris-page-gov.github.io/okf-LandRegistry/id/.
      equivalence_policy: A redirect or similar title does not establish identity without source evidence.
      evidence_refs: [EV-GOVUK-SEARCH]
    - id: IDSCHEME-HMLR-DATASET
      issuer: HM Land Registry
      syntax: Canonical publisher URL and dataset slug.
      scope: HMLR datasets and distributions
      persistence: Preserve renamed legacy slugs as aliases, not replacement identities.
      normalization: Keep source slug and full canonical URL.
      collision_policy: Fail closed on duplicate canonical URLs or slugs within one source.
      uri_policy: Mint local IRIs from source kind and slug while retaining canonical source URL.
      equivalence_policy: Related fields or titles do not make two datasets identical.
      evidence_refs: [EV-ULPD]
    - id: IDSCHEME-GITHUB
      issuer: GitHub and HM Land Registry
      syntax: LandRegistry/<repository>
      scope: Public repositories
      persistence: Renames and transfers require explicit source metadata.
      normalization: Case-preserving full_name plus case-insensitive collision check.
      collision_policy: Fail closed on duplicate repository IDs or normalized names.
      uri_policy: Use the GitHub html_url as source identity and a local derived IRI.
      equivalence_policy: Fork, archive or successor relationships are not owl:sameAs.
      evidence_refs: [EV-GITHUB]
  identifier_policy:
    native_identifier_rule: Preserve source routes, slugs, content IDs, service versions and repository full names verbatim.
    route_rule: Use deterministic lower-case percent-safe routes prefixed by source family; record every alias and collision.
    iri_rule: Mint only repository-controlled derived IRIs and retain the canonical source URL separately.
    collision_rule: Fail closed on identity collision; never add numeric suffixes silently.
    redirect_rule: Preserve source redirects and explicit replacement evidence; do not guess moved routes.
  relationship_types:
    - id: REL-HAS-PART
      label: has part
      predicate_iri: http://purl.org/dc/terms/hasPart
      inverse_label: is part of
      source_types: [Official publication or guidance record, Dataset]
      target_types: [Official publication or guidance record, Dataset]
      direction: directed
      minimum_evidence: Source-declared collection membership or distribution listing.
      permitted_derivations: [source-native, normalized]
      temporal_meaning: True for the observed source snapshot.
      cardinality: zero or more
      non_properties: [A hyperlink alone is not membership.]
      task_refs: [TASK-PRACTICE, TASK-DATASET]
    - id: REL-DOCUMENTS
      label: documents
      predicate_iri: http://xmlns.com/foaf/0.1/page
      inverse_label: is documented by
      source_types: [Official publication or guidance record]
      target_types: [Operational service or API product, Dataset]
      direction: directed
      minimum_evidence: Explicit publisher documentation link.
      permitted_derivations: [source-native, normalized]
      temporal_meaning: Documentation relationship observed at snapshot time.
      cardinality: zero or more
      non_properties: [Documentation does not imply public access.]
      task_refs: [TASK-API, TASK-DATASET]
    - id: REL-SUPERSEDES
      label: supersedes
      predicate_iri: http://purl.org/dc/terms/replaces
      inverse_label: is superseded by
      source_types: [Official publication or guidance record, Operational service or API product]
      target_types: [Official publication or guidance record, Operational service or API product]
      direction: directed
      minimum_evidence: Explicit publisher replacement, redirect or formal notice.
      permitted_derivations: [source-native, normalized]
      temporal_meaning: Replacement applies from the source-stated date.
      cardinality: zero or more
      non_properties: [Newer publication date alone does not prove supersession.]
      task_refs: [TASK-PRACTICE, TASK-API, TASK-AUDIT]
  temporal_model:
    distinctions:
      - Source publication time
      - Source metadata modification time
      - Dataset release and coverage period
      - Service observation time
      - Acquisition time
      - Bundle generation and release time
    version_semantics: Preserve source-native editions, releases, schema versions and immutable commits; never infer them from one generic date.
    freshness_semantics: Freshness is source-family specific and always measured from an explicit observation or release event.
  equivalence_policy: Do not assert identity from title, URL similarity, shared title number, address, hierarchy or embedding similarity.
  prohibited_inferences:
    - Do not infer legal ownership, exact boundary or priority from discovery metadata.
    - Do not infer beneficial ownership from corporate proprietor data.
    - Do not infer open reuse from public or free access.
    - Do not infer dataset currency from catalogue modification.
    - Do not infer nationwide LLC coverage from service availability.
    - Do not use owl:sameAs without authoritative identity evidence.

