profile_id: urn:okf-domain-profile:hm-land-registry-public-estate:v1
version: "1"
status: approved
prepared_at: "2026-07-29T07:53:38Z"
research_cutoff: "2026-07-29"
title: HM Land Registry public-estate domain profile
description: >-
  A snapshot-bounded, metadata-led profile for discovering HM Land Registry
  guidance, forms, services, datasets, APIs, developer resources and public
  repositories without replacing authoritative sources or redistributing
  restricted property data.

intent:
  problem: >-
    HM Land Registry material is spread across GOV.UK, publisher-operated data
    and transaction services, developer documentation, linked data, help
    systems, GitHub and an official blog, with materially different authority,
    freshness, access and reuse conditions.
  desired_outcomes:
    - People and agents can find the authoritative route for a land-registration task.
    - Data users can compare datasets by coverage, cadence, format, access and licence.
    - Property professionals and developers can distinguish public guidance from restricted operational services.
    - Every discovery result exposes its source, observation date, authority role and material caveats.
  non_goals:
    - The bundle will not provide legal advice or determine ownership, boundaries or priority.
    - The bundle will not contain title-register, title-plan, search-result or bulk property records.
    - The bundle will not authenticate to, automate or monitor restricted HM Land Registry services.
    - The bundle will not claim completeness outside a named, dated denominator.
  target_okf_version: "0.2"
  risk_level: high

input_snapshot:
  locations:
    - ../research/source-family-inventory.json
    - ../source/snapshots/2026-07-29T091915Z/manifest.json
    - https://www.gov.uk/api/search.json?filter_organisations=land-registry
    - https://use-land-property-data.service.gov.uk/
    - https://github.com/LandRegistry
    - https://github.com/co-cddo/api-catalogue
  snapshot_id: hmlr-domain-warmup-20260729
  inventory_sha256: d463585dfa9d427a8c88dbf499b3df4da1bf7d0dcc0c73644bca817b32c2c30e
  item_count: 15
  byte_count: 13816
  sampling_method: >-
    Census of source families; exact GOV.UK Search count; official collection
    and service-page review; stratified review of public, professional,
    dataset, geospatial, API, governance, rights and accessibility routes.
  exclusions:
    - Page bodies and binary attachments
    - Authenticated service results and paid documents
    - Bulk title, ownership, address, polygon and transaction records
    - Public-forum posts and user uploads
    - Unofficial mirrors and third-party property-data services

collection_profile:
  document_families:
    - GOV.UK guidance, forms, collections, statistics, notices and corporate publications
    - Dataset landing pages, technical specifications and distribution metadata
    - Transactional and informational service descriptions
    - API and Business Gateway developer documentation
    - Public source-code repository metadata
    - Help, accessibility, privacy and rights statements
    - Official blog and subscription-channel metadata
  formats:
    - HTML
    - JSON
    - CSV
    - Markdown
    - XML, WSDL and XSD
    - GML
    - PDF, ODT and ODS metadata only
  languages:
    - en-GB
    - cy where an official Welsh representation is linked
  date_ranges:
    - Historical 1862 Act Register material
    - Current public material observed through 2026-07-29
  representation_relationships:
    - A GOV.UK route may have HTML, Welsh, attachment and Content API representations.
    - A dataset may have landing page, technical specification, full, delta, API and linked-data distributions.
    - A Business Gateway product may have documentation, schema, WSDL, test and production endpoints.
  duplicate_policy: >-
    Preserve source-native routes and identifiers; relate alternate
    representations without collapsing documents, datasets, distributions,
    services or versions.
  extraction_constraints:
    - Metadata only from public, bounded routes.
    - Do not follow signed download URLs or store credentials.
    - Do not automate services whose terms prohibit automated agents.
    - Bound response size, redirects and pagination; reject unsafe URLs.
  sensitivity_findings:
    - Land-register information can contain personal information even when statutory access exists.
    - Corporate and Price Paid datasets contain third-party address rights.
    - Public forum content can expose personal or sensitive information.
    - Property searches and title products have legal and financial consequences.

scope:
  record_definition: >-
    One source-native public discovery object: a GOV.UK edition/route, HMLR
    dataset, operational service, API product, public repository or governed
    source-family entry. Distributions and versions remain separately typed
    when represented.
  included:
    - All records returned by the frozen GOV.UK Search query attributed to organisation slug land-registry.
    - Publisher-operated HMLR dataset and service metadata selected by deterministic source adapters.
    - Public HMLR GitHub repository metadata and CDDO API Catalogue records when acquired.
    - Source-family, rights, standards, persona, evaluation and provenance control records.
  excluded:
    - Live property, title, ownership, address, charge, application and search-result data.
    - Full GOV.UK page bodies and downloaded attachments.
    - Authenticated API responses, portal content and paid products.
    - Third-party republications without official provenance.
  boundary_status: partial
  denominators:
    - id: DEN-GOVUK
      description: GOV.UK Search records attributed to organisation slug land-registry.
      value: 1866
      as_of: "2026-07-29"
      basis: GOV.UK Search API total observed with count=0.
      evidence_refs: [EV-GOVUK-SEARCH, EV-ACQUISITION-SNAPSHOT]
    - id: DEN-ULPD
      description: Dataset entries visible on the Use land and property data catalogue.
      value: 14
      as_of: "2026-07-29"
      basis: Publisher catalogue observation; requires deterministic adapter reconciliation before a completeness claim.
      evidence_refs: [EV-ULPD]
    - id: DEN-CDDO-API
      description: CDDO API Catalogue rows whose provider is hm-land-registry.
      value: 15
      as_of: "2026-07-29"
      basis: Exact frozen live provider-filtered official catalogue observation; an older sibling seed contained 27 records.
      evidence_refs: [EV-CDDO, EV-ACQUISITION-SNAPSHOT]
    - id: DEN-GITHUB
      description: Public repositories displayed for the LandRegistry GitHub organisation.
      value: 289
      as_of: "2026-07-29"
      basis: Exact frozen public GitHub API census.
      evidence_refs: [EV-GITHUB, EV-ACQUISITION-SNAPSHOT]
  unexplained_omissions:
    - No global page-level denominator exists across all associated HMLR domains.
    - Blog posts, help-centre articles and forum content are not enumerated in this profile.
    - The exact current Business Gateway service denominator needs publisher-pack reconciliation.
  snapshot_policy: snapshot-bounded

authority_model:
  source_authorities:
    - HM Land Registry is authoritative for its current formal guidance, services, datasets and operational documentation.
    - Legislation.gov.uk is authoritative for enacted legislation and official revised text.
    - Government Digital Service is authoritative for GOV.UK Search and Content API metadata.
    - Repository owners and dataset licensors are authoritative for their own licences and access terms.
  semantic_authorities:
    - Source-native HMLR definitions, identifiers, exclusions and version semantics take precedence over local normalization.
    - Current legislation and formal notices outrank older service matrices, roadmaps and catalogue summaries.
    - Publisher-operated dataset pages outrank discovery catalogues for cadence, access and operational status.
  operational_authorities:
    - Publisher-operated service pages, developer packs, terms and status notices define current operation.
    - The repository maintainer controls only the derived static publication and its release state.
  decision_authorities:
    - The project owner approves scope, profile and release decisions.
    - HM Land Registry and relevant rights holders alone can determine source access, licence and official interpretation.

