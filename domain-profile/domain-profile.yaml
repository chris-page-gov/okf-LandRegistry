rights_access_privacy:
  - id: RIGHT-GOVUK
    layer: GOV.UK and HMLR page metadata
    operation: Store and redistribute titles, descriptions, routes, document types and dates with attribution.
    status: permitted
    basis: GOV.UK pages state OGL v3 except where otherwise stated; the bundle retains metadata and source links only.
    licence: Open Government Licence v3.0, subject to exceptions.
    attribution: Contains public-sector information licensed under the Open Government Licence v3.0; source publisher and route retained.
    third_party_terms: Page attachments and third-party content can have separate terms.
    access_constraint: Recheck exceptions and do not copy full page bodies or attachments in this scaffold.
    mitigation: Per-record source, rights status and exception field.
    owner: Repository maintainer
    evidence_refs: [EV-HMLR-ORG, EV-PUBLIC-DATA]
  - id: RIGHT-DATASETS
    layer: HMLR dataset metadata and data distributions
    operation: Store metadata and link to data; do not redistribute production data.
    status: conditional
    basis: Dataset terms range from OGL to bespoke direct-use, exploration and commercial licences with third-party rights.
    licence: Per-dataset
    attribution: Preserve the exact publisher-specified HMLR, Ordnance Survey, Royal Mail or other attribution.
    third_party_terms: Address, mapping, GeoPlace, Ordnance Survey and Royal Mail rights can apply.
    access_constraint: Account, accepted licence, fee or API key may be required.
    mitigation: Publish metadata and small expressly permitted samples only; never flatten rights to a bundle-wide licence.
    owner: Repository maintainer and data user
    evidence_refs: [EV-PUBLIC-DATA, EV-ULPD, EV-INSPIRE-DATA]
  - id: RIGHT-RESTRICTED
    layer: Property, LLC, portal and Business Gateway services
    operation: Automated access, result collection or redistribution.
    status: prohibited
    basis: Services require accounts, approval, payment or certificates; LLC terms explicitly prohibit automated agents and copying.
    licence: Service-specific terms
    attribution: ""
    third_party_terms: Address, map and originating-authority rights may apply.
    access_constraint: Public descriptions only; do not authenticate or execute.
    mitigation: Store only public service metadata and link users to the official route.
    owner: Repository maintainer
    evidence_refs: [EV-PROPERTY-SERVICE, EV-LLC-TERMS, EV-BG-DOCS]
  - id: RIGHT-GITHUB
    layer: Public GitHub repository metadata and source code
    operation: Store and redistribute repository metadata; do not copy source trees.
    status: conditional
    basis: Each repository declares its own licence and lifecycle; missing licence means no reuse assumption.
    licence: Per-repository
    attribution: Preserve organisation, repository URL and declared licence identifier.
    third_party_terms: Forks and vendored dependencies retain their own rights.
    access_constraint: Public API rate limits and GitHub terms apply.
    mitigation: Metadata-only census with per-record licence, fork and archive state.
    owner: Repository maintainer
    evidence_refs: [EV-GITHUB]
  - id: RIGHT-CDDO
    layer: CDDO API Catalogue metadata
    operation: Store provider-filtered discovery metadata.
    status: conditional
    basis: Official public GitHub catalogue used as discovery provenance; downstream endpoint rights remain separate.
    licence: Repository terms and per-service terms
    attribution: Central Digital and Data Office API Catalogue plus publisher-operated HMLR source.
    third_party_terms: Endpoint and documentation rights remain with their publishers.
    access_constraint: Catalogue absence does not grant rights or establish current operation.
    mitigation: Retain source commit and re-verify against HMLR documentation.
    owner: Repository maintainer
    evidence_refs: [EV-CDDO]
  - id: RIGHT-EVIDENCE
    layer: Project-authored acquisition and validation receipts
    operation: Store and publish deterministic local provenance receipts.
    status: permitted
    basis: The acquisition manifest is project-authored provenance metadata that identifies, but does not relicense, separately governed GOV.UK, GitHub and CDDO observations.
    licence: CC BY 4.0 for original receipt metadata; underlying sources retain their own terms.
    attribution: HM Land Registry public-estate OKF Bundle contributors, version and canonical release URL.
    third_party_terms: Source URLs, response metadata and described source records remain subject to their applicable source-layer terms.
    access_constraint: The receipt may record only bounded request metadata, counts, digests and source locators; it does not authorise reuse of underlying source content.
    mitigation: Publish only receipt metadata and retain per-source rights references for every acquired record.
    owner: Repository maintainer
    evidence_refs: [EV-ACQUISITION-SNAPSHOT]
  - id: RIGHT-PERSONAL
    layer: Property, register, help-forum and user-submitted personal information
    operation: Acquire, combine, index or expose personal-level content.
    status: prohibited
    basis: The discovery purpose does not require personal-level records and public accessibility does not remove privacy or ethical risk.
    licence: Not applicable
    attribution: ""
    third_party_terms: Statutory register-access regimes and service privacy terms apply.
    access_constraint: No live property results, forum posts, user uploads or personal contact data.
    mitigation: Metadata allowlists, secret and PII scans, aggregate-only evaluation fixtures.
    owner: Repository maintainer
    evidence_refs: [EV-PERSONAL-INFO, EV-CUSTOMER-HELP]

architecture:
  profile_level: large-corpus
  bundle_shape: large-corpus
  canonical_authoring: markdown
  generated_representations:
    - okf-explorer-descriptor
    - json-ld
    - csv
    - release-archive
  refresh_strategy: >-
    Acquire immutable, content-addressed source envelopes outside the public
    projection; build only from a frozen snapshot; use the governed
    artifact-dependency graph to select affected gates but fail closed where
    evidence cannot be carried forward; execute the pinned OKF Explorer
    consumer contract before publication; publish later observations as a new
    snapshot rather than backpatching release bytes.
  namespace_strategy: https://chris-page-gov.github.io/okf-LandRegistry/id/ with source-native identifiers retained.
  scale_assumptions: >-
    At least 1,866 GOV.UK records plus up to 289 public repositories, 15 CDDO
    API rows, approximately 14 dataset records and control concepts; use lazy,
    integrity-bound Explorer overview, chunk, search, locator and adjacency
    entrypoints with bounded result rendering.

enrichment:
  enabled: false
  purpose: AI-assisted authoring does not authorise model-generated corpus assertions; published classifications remain source-native or deterministically derived.
  permitted_derivations: [source-native, normalized, rule-derived]
  evidence_requirement: Every non-source-native field names its source fields, deterministic method and observation.
  independent_review: Domain and rights assertions require review independent of the generating implementation; reviewer kind must be disclosed.
  authority_boundary: Derived metadata never becomes an official HMLR statement.
  budget: No paid model or API calls are authorised.

validation:
  - id: VAL-DOMAIN-PROFILE
    target: Domain profile pack
    method: Validate JSON and YAML against okf-domain-profile.v1, references and canonical equivalence.
    validator: Pinned OKF Explorer check_domain_profile.py
    severity: error
    release_gate: true
    receipt: validation/domain-profile.json
  - id: VAL-SNAPSHOT
    target: Frozen source snapshot
    method: Rehash every envelope, validate media type and reconcile one terminal outcome per expected source item.
    validator: scripts/check_snapshot.py
    severity: error
    release_gate: true
    receipt: validation/source-snapshot.json
  - id: VAL-OKF
    target: OKF 0.2 Markdown control plane
    method: Validate reserved files, concept types, actors, provenance and lifecycle.
    validator: scripts/check_bundle.py
    severity: error
    release_gate: true
    receipt: validation/okf-core.json
  - id: VAL-DATA-PLANE
    target: Explorer descriptor, manifest, records, search and relationships
    method: Validate schemas, safe paths, stable routes, referential integrity, counts, chunk bounds and checksums.
    validator: scripts/check_bundle.py
    severity: error
    release_gate: true
    receipt: validation/data-plane.json
  - id: VAL-RIGHTS
    target: Public records and links
    method: Require per-record access and rights states; scan for credentials, signed URLs, personal data and forbidden source layers.
    validator: scripts/check_bundle.py and tests/test_safety.py
    severity: error
    release_gate: true
    receipt: validation/rights-safety.json
  - id: VAL-EVALUATION
    target: Persona and question suite
    method: Check question-to-story-to-persona traceability, direct-source expectations, retrieval metrics and hard failures.
    validator: scripts/evaluate.py
    severity: error
    release_gate: true
    receipt: bundle/data/evaluation-report.json
  - id: VAL-ACCESSIBILITY
    target: GitHub Pages site
    method: Static semantic checks plus keyboard, focus, reflow, contrast and no-JavaScript browser journeys.
    validator: tests/test_site.py and browser acceptance suite
    severity: error
    release_gate: true
    receipt: validation/accessibility.json
  - id: VAL-REPRODUCIBILITY
    target: Complete generated bundle
    method: Build twice from the same frozen inputs and compare every generated byte and checksum.
    validator: scripts/build.py --check
    severity: error
    release_gate: true
    receipt: validation/reproducibility.json
  - id: VAL-EXPLORER-CONSUMER
    target: Pinned OKF Explorer consumer and public deep link
    method: Execute a tiny fixture and the exact candidate in the pinned OKF Explorer; require load, search, facet, detail, resource, relationship and deep-link journeys without console or resource failures; repeat the canonical deep link after deployment.
    validator: tests/test_explorer_contract.py and pinned browser acceptance suite
    severity: error
    release_gate: true
    receipt: validation/explorer-consumer.json
  - id: VAL-CHANGE-IMPACT
    target: Authored inputs, generated outputs, consumer contracts and release gates
    method: Validate the artifact-dependency graph, classify changed paths, select transitive outputs, consumers and gates, and fail closed on unknown or generated-only changes.
    validator: scripts/change_impact.py
    severity: error
    release_gate: true
    receipt: validation/change-impact.json

evaluation:
  competency_questions:
    - id: CQ-PUBLIC
      question: Can a public user find the correct property-information route and see the official-copy and boundary warnings?
      task_refs: [TASK-PUBLIC-ROUTE]
      expected_evidence: Canonical GOV.UK service route, product descriptions, costs as volatile metadata and evidential distinction.
      temporal_context: Revalidate at time of action.
      citation_expectation: HM Land Registry GOV.UK service guidance.
      near_miss_rule: A generic contact page or unqualified title-plan result is not correct.
      verification_status: independently-verified
    - id: CQ-PRACTICE
      question: Can a professional retrieve the current practice guide, form, fee and digital route for a named task?
      task_refs: [TASK-PRACTICE]
      expected_evidence: Current formal routes with document type and publisher dates.
      temporal_context: Snapshot as of 2026-07-29, with live revalidation warning.
      citation_expectation: GOV.UK HMLR collections and formal notice.
      near_miss_rule: An older summary without the current formal source is insufficient.
      verification_status: independently-verified
    - id: CQ-DATASET
      question: Can a data user compare PPD, UK HPI, corporate ownership, lease, covenant, requisition and polygon products without collapsing rights or cadence?
      task_refs: [TASK-DATASET]
      expected_evidence: Publisher landing pages, technical specifications and per-dataset rights.
      temporal_context: Dated snapshot; latest release checked separately.
      citation_expectation: Use land and property data or formal GOV.UK dataset page.
      near_miss_rule: A catalogue record without canonical operational evidence is not sufficient.
      verification_status: independently-verified
    - id: CQ-SPATIAL
      question: Can a user distinguish title plans, INSPIRE Index Polygons, LLC polygons and National Polygon products?
      task_refs: [TASK-SPATIAL]
      expected_evidence: Coverage, freehold/leasehold distinction, indicative status, CRS, licence and cadence.
      temporal_context: Current publisher specification at snapshot time.
      citation_expectation: HMLR spatial dataset page and technical guidance.
      near_miss_rule: Any answer implying an exact legal boundary is wrong.
      verification_status: independently-verified
    - id: CQ-API
      question: Can a developer identify REST versus SOAP, test versus production and documentation versus authorised operation?
      task_refs: [TASK-API]
      expected_evidence: Official developer pack, protocol, schema version, environment and authentication.
      temporal_context: Revalidate immediately before integration.
      citation_expectation: Publisher-operated HMLR developer documentation and current notice.
      near_miss_rule: A CDDO catalogue row alone or an unqualified endpoint is insufficient.
      verification_status: independently-verified
    - id: CQ-LLC
      question: Can a user determine whether HMLR covers an authority and understand the LLC versus CON29 boundary?
      task_refs: [TASK-LLC]
      expected_evidence: Current migration table, service terms and PG79.
      temporal_context: Authority coverage is volatile.
      citation_expectation: HMLR LLC programme and service terms.
      near_miss_rule: A general LLC service link without coverage and CON29 caveats is insufficient.
      verification_status: independently-verified
    - id: CQ-AUDIT
      question: Can an auditor trace each sampled claim to source, observation, derivation, rights and validation state?
      task_refs: [TASK-AUDIT]
      expected_evidence: Machine-readable provenance and direct publisher link.
      temporal_context: Exact frozen candidate.
      citation_expectation: Immutable snapshot receipt plus source route.
      near_miss_rule: A link without claim-level provenance or a validation score without evidence fails.
      verification_status: independently-verified
  hard_failures:
    - Legal, ownership, priority or exact-boundary advice is presented as a bundle conclusion.
    - A restricted, bespoke or unknown right is presented as OGL or unrestricted.
    - Catalogue modification time is presented as dataset release, validity or coverage.
    - A restricted service is called, monitored or presented as an anonymous public API.
    - A credential, signed download URL, personal-level record or forum upload enters the public bundle.
    - A result cannot resolve its authoritative source and observation.
    - Unknown, candidate or untested evidence is relabelled verified.
  strata:
    - Public service and official-copy discovery
    - Practice guide, form, fee and notice
    - Open, bespoke and chargeable datasets
    - Temporal lag, revision and stale catalogue metadata
    - Indicative spatial products and CRS
    - SOAP, REST, linked data and restricted access
    - LLC migration, coverage and CON29 near miss
    - Welsh, keyboard, screen-reader, zoom and no-JavaScript access
    - Unanswerable, conflicting, unavailable and unsafe cases
  citation_policy: Every material proposition must cite the exact publisher route or frozen source envelope; discovery catalogues cannot establish current operational status alone.
  independent_verification: The 24-question first-release suite was reviewed by an AI agent independent of the retrieval implementation against the frozen snapshot; this is not human domain assurance or participant research.
  baselines:
    - Direct navigation and search on the named official source.
    - Deterministic lexical search over the frozen normalized catalogue.
  metrics:
    - Recall@5 and Recall@10
    - Mean reciprocal rank of the primary target
    - nDCG@10 for graded alternatives
    - Source-resolution and citation-support rate
    - Rights, access, freshness and caveat field coverage
    - Persona, story, source-family and failure-stratum coverage
    - Keyboard, focus, reflow and semantic-structure journey pass rate
  thresholds:
    - Zero hard failures.
    - Every reviewed question maps to at least one story, persona, source and evidence expectation.
    - Primary-target MRR at least 0.80 and Recall@10 at least 0.90 for independently verified answerable questions.
    - Source-resolution and required caveat coverage equal 1.00.
    - No critical category added by the second held-out adversarial pass.
  challenge_policy: Use two disjoint held-out passes containing stale, conflicting, similarly named, restricted, unanswerable and unsafe cases; publish new critical categories rather than averaging them away.

constraints:
  - id: CONSTRAINT-LLC-AUTOMATION
    kind: access
    effect: LLC service terms prohibit automated software agents from searching, copying or monitoring the service.
    mitigation: Keep only public service metadata and programme/coverage links; never execute the search.
    owner: Repository maintainer
    disposition: mitigated
    evidence_refs: [EV-LLC-TERMS]
  - id: CONSTRAINT-MIXED-LICENCES
    kind: licence
    effect: Dataset rights range from OGL to direct-use, exploration and chargeable commercial licences with third-party rights.
    mitigation: Per-record rights and access states; metadata-only publication; no bundle-wide data licence claim.
    owner: Repository maintainer
    disposition: mitigated
    evidence_refs: [EV-PUBLIC-DATA, EV-ULPD]
  - id: CONSTRAINT-AUTH
    kind: authentication
    effect: Business Gateway, portal, property services and some dataset APIs require accounts, approval, payment, keys or certificates.
    mitigation: Document access requirements and prohibit execution or secret storage.
    owner: Repository maintainer
    disposition: mitigated
    evidence_refs: [EV-BG-DOCS, EV-ULPD-API, EV-PROPERTY-SERVICE]
  - id: CONSTRAINT-PRIVACY
    kind: privacy
    effect: Register information, property results and forum content can contain personal or sensitive information.
    mitigation: Exclude personal-level records and user-supplied content; run allowlist and safety checks.
    owner: Repository maintainer
    disposition: mitigated
    evidence_refs: [EV-PERSONAL-INFO, EV-CUSTOMER-HELP]
  - id: CONSTRAINT-VOLATILITY
    kind: availability
    effect: Fees, service state, local-authority migration, datasets and GOV.UK content change on different cadences.
    mitigation: Snapshot every source, expose observed and source dates separately, and require live revalidation before action.
    owner: Repository maintainer
    disposition: recorded
    evidence_refs: [EV-HMLR-ORG, EV-LLC-PROGRAMME, EV-ULPD]
  - id: CONSTRAINT-SCALE
    kind: technical
    effect: The catalogue exceeds a small-bundle payload and source distributions can be multi-gigabyte.
    mitigation: Lazy metadata shards, bounded search, no production data files and explicit performance budgets.
    owner: Repository maintainer
    disposition: mitigated
    evidence_refs: [EV-GOVUK-SEARCH, EV-ULPD]

gaps:
  - id: GAP-ASSOCIATED-DENOMINATOR
    description: No global page-level denominator exists across all HMLR-associated domains.
    impact: Completeness can be claimed only per named source denominator.
    blocking: false
    owner: Repository maintainer
    next_action: Maintain separate source-family denominators and publish unexplained omissions.
    evidence_refs: [EV-INVENTORY]
  - id: GAP-BG-DENOMINATOR
    description: The exact current Business Gateway product/schema population has not been reconciled from the publisher pack.
    impact: The initial API lane is discovery-complete only against the 15-row frozen CDDO denominator.
    blocking: false
    owner: Repository maintainer
    next_action: Build a deterministic index from pinned HMLR developer-pack navigation and formal notices.
    evidence_refs: [EV-BG-DOCS, EV-CDDO]
  - id: GAP-DATASET-DENOMINATOR
    description: The observed 14-item dataset catalogue count needs deterministic adapter confirmation.
    impact: Do not claim complete HMLR dataset coverage in the scaffold.
    blocking: false
    owner: Repository maintainer
    next_action: Reconcile catalogue cards, API-visible and external dataset pages with explicit outcomes.
    evidence_refs: [EV-ULPD]
  - id: GAP-LINKED-DATA
    description: Linked-data capability, schema and query limits were not fully exercised.
    impact: Linked data is documented as a source family but not claimed operationally assured.
    blocking: false
    owner: Repository maintainer
    next_action: Add bounded capability fixtures and publisher-documentation checks without unbounded queries.
    evidence_refs: [EV-LINKED-DATA]
  - id: GAP-HUMAN-RESEARCH
    description: Personas and user stories are evidence-led hypotheses, not participant-validated findings.
    impact: The site cannot claim to be a preferred or fully usable interface for real users.
    blocking: false
    owner: Project owner
    next_action: Commission accessibility-expert and representative-user research after the deterministic scaffold is stable.
    evidence_refs: [EV-HMLR-RESEARCH]
  - id: GAP-WELSH
    description: Welsh representation parity has not been enumerated or evaluated.
    impact: The scaffold can expose official Welsh routes but cannot claim bilingual parity.
    blocking: false
    owner: Repository maintainer
    next_action: Add language relationships and Welsh journey fixtures from the frozen GOV.UK metadata.
    evidence_refs: [EV-PUBLIC-GUIDANCE]
  - id: GAP-OWNER-APPROVAL
    description: Owner approval is exact-digest scoped; v0.2.0 remains a candidate until its exact G9 record is approved as an AI-generated proof of concept.
    impact: Every later candidate remains draft until a new G9 record approves its version, digest, residual risks and canonical identity.
    blocking: false
    owner: Project owner
    next_action: Repeat the exact-digest owner decision for every later release.
    evidence_refs: [EV-INVENTORY]

decisions:
  - id: DEC-SNAPSHOT
    question: Should the bundle resolve sources live or publish a frozen snapshot?
    recommended_default: Snapshot-bounded publication with explicit source and observation dates.
    alternatives: [Live resolution, Hybrid snapshot and bounded live reconciliation]
    consequences: [Snapshot builds are reproducible; users must revalidate volatile facts before action.]
    status: accepted
    owner: Project owner through the scaffold request
    blocking_for_build: false
    due_point: Reconsider before any live provider integration.
    evidence_refs: [EV-OKF-AUTHORING, EV-INVENTORY]
  - id: DEC-METADATA-ONLY
    question: What source content may the public scaffold retain?
    recommended_default: Public metadata, provenance and links only; no property-level, bulk dataset, forum or authenticated content.
    alternatives: [Licensed bounded samples after rights review]
    consequences: [Broad safe discovery remains possible without redistributing controlled data.]
    status: accepted
    owner: Project owner through the scaffold request
    blocking_for_build: false
    due_point: Any later request to include source content or samples.
    evidence_refs: [EV-PUBLIC-DATA, EV-LLC-TERMS, EV-PERSONAL-INFO]
  - id: DEC-ARCHITECTURE
    question: Which OKF bundle shape fits the declared source population?
    recommended_default: Large-corpus descriptor with a Markdown control plane, integrity-bound lazy static data, a pinned OKF Explorer consumer contract and a governed artifact-dependency graph.
    alternatives: [Small Markdown bundle, Federation by source family]
    consequences:
      - Supports the 1,866-record GOV.UK denominator; actual consumer journeys become hard release gates; dependency analysis can select substantive reruns without carrying evidence across changed roots; source families can later federate if governance diverges.
    status: accepted
    owner: Project owner through the scaffold request
    blocking_for_build: false
    due_point: Reassess when full snapshot sizes and independent release cadences are measured.
    evidence_refs: [EV-GOVUK-SEARCH, EV-OKF-AUTHORING]
  - id: DEC-AUTHORITY
    question: Which source controls operational metadata when catalogues and HMLR pages differ?
    recommended_default: Current publisher-operated HMLR page or formal notice, while preserving the catalogue record as discovery provenance.
    alternatives: [Catalogue-only view]
    consequences: [Freshness and access claims remain supportable without erasing provenance.]
    status: accepted
    owner: Project owner through the scaffold request
    blocking_for_build: false
    due_point: Apply in every source adapter and conflict record.
    evidence_refs: [EV-PUBLIC-DATA, EV-OKF-AUTHORING]
  - id: DEC-ENRICHMENT
    question: Should model-assisted classifications or relationships enter the first scaffold?
    recommended_default: No; use source-native and deterministic normalized fields only.
    alternatives: [Separately labelled candidate enrichment after calibration and independent review]
    consequences: [The first corpus is conservative and explainable.]
    status: accepted
    owner: Project owner through the request for an evidence-led scaffold
    blocking_for_build: false
    due_point: Revisit only for a demonstrated search or semantic gap.
    evidence_refs: [EV-OKF-AUTHORING]
  - id: DEC-RELEASE
    question: Is the reviewed scaffold authorised for public release and a canonical GitHub Pages identity?
    recommended_default: Prepare v0.2.0 as an AI-generated proof of concept at the canonical Pages URL, but publish it only after G1-G8 pass receipts and an exact-digest G9 owner approval.
    alternatives: [Keep the candidate unpublished]
    consequences:
      - Only the exact v0.2.0 digest named in G9 may be published as an AI-generated proof of concept.
      - Later candidates remain unapproved until a new exact-digest decision.
    status: accepted
    owner: Project owner
    blocking_for_build: false
    due_point: Repeat before every later release or canonical identity change.
    evidence_refs: [EV-INVENTORY]

traceability:
  - id: TRACE-DISCOVERY
    intent_or_requirement: Find authoritative HMLR material across the public estate.
    task_refs: [TASK-PUBLIC-ROUTE, TASK-PRACTICE, TASK-DATASET, TASK-API, TASK-LLC]
    planned_artifacts: [bundle/okf-explorer.json, bundle/data/manifest.json, bundle/data/catalogue.json, bundle/index.html]
    validation_refs: [VAL-DATA-PLANE, VAL-EVALUATION]
    evidence_refs: [EV-GOVUK-SEARCH, EV-INVENTORY]
    status: accepted
  - id: TRACE-PROVENANCE
    intent_or_requirement: Keep source authority, derivation, freshness, availability and release state distinct.
    task_refs: [TASK-AUDIT]
    planned_artifacts: [bundle/data/manifest.json, bundle/data/coverage.json, bundle/data/provenance.json]
    validation_refs: [VAL-SNAPSHOT, VAL-DATA-PLANE]
    evidence_refs: [EV-OKF-AUTHORING, EV-INVENTORY]
    status: accepted
  - id: TRACE-RIGHTS
    intent_or_requirement: Preserve mixed dataset and service rights without unsafe acquisition.
    task_refs: [TASK-DATASET, TASK-API, TASK-LLC, TASK-AUDIT]
    planned_artifacts: [docs/sources-rights-and-ethics.md, bundle/data/rights.json]
    validation_refs: [VAL-RIGHTS]
    evidence_refs: [EV-PUBLIC-DATA, EV-LLC-TERMS, EV-PERSONAL-INFO]
    status: accepted
  - id: TRACE-PERSONAS
    intent_or_requirement: Provide evidence-led personas, stories and evaluation coverage.
    task_refs: [TASK-PUBLIC-ROUTE, TASK-PRACTICE, TASK-DATASET, TASK-SPATIAL, TASK-API, TASK-LLC, TASK-AUDIT]
    planned_artifacts: [personas/personas-and-user-stories.json, evaluation/questions.json, evaluation/journeys.json]
    validation_refs: [VAL-EVALUATION, VAL-ACCESSIBILITY]
    evidence_refs: [EV-PUBLIC-GUIDANCE, EV-PRO-GUIDANCE, EV-HMLR-RESEARCH]
    status: accepted
  - id: TRACE-PAGES
    intent_or_requirement: Publish a durable, accessible GitHub Pages discovery site.
    task_refs: [TASK-PUBLIC-ROUTE, TASK-DATASET, TASK-AUDIT]
    planned_artifacts: [bundle/index.html, bundle/accessibility.html, .github/workflows/pages.yml]
    validation_refs: [VAL-ACCESSIBILITY, VAL-REPRODUCIBILITY]
    evidence_refs: [EV-WCAG, EV-OKF-AUTHORING]
    status: accepted
  - id: TRACE-SAFETY
    intent_or_requirement: Avoid legal overclaim, secrets, personal data and restricted-service automation.
    task_refs: [TASK-PUBLIC-ROUTE, TASK-SPATIAL, TASK-API, TASK-LLC, TASK-AUDIT]
    planned_artifacts: [SECURITY.md, docs/sources-rights-and-ethics.md, validation/rights-safety.json]
    validation_refs: [VAL-RIGHTS, VAL-DATA-PLANE]
    evidence_refs: [EV-PROPERTY-SERVICE, EV-LLC-TERMS, EV-PERSONAL-INFO]
    status: accepted

