users:
  - id: USER-PUBLIC
    role: Member of the public, property owner, buyer or seller
    context: Finding trustworthy information without routine professional access.
    authority_requirement: Must reach current official guidance and understand when legal representation or an official copy is needed.
    accessibility_language_needs: [Plain language, keyboard and screen-reader access, zoom/reflow, Welsh route where officially available]
    needs:
      - Find the right property-information, registration, correction or fraud-prevention route.
      - Understand product cost, coverage and evidential status.
    risks:
      - Treating general information as legal advice.
      - Treating a downloaded register or indicative plan as official proof or an exact boundary.
    evidence_refs: [EV-PUBLIC-GUIDANCE, EV-PROPERTY-SERVICE]
  - id: USER-PROFESSIONAL
    role: Conveyancer or property professional
    context: Preparing or managing land-registration applications.
    authority_requirement: Current practice guide, form, fee, notice and digital-service guidance must be distinguishable by date and authority.
    accessibility_language_needs: [Efficient keyboard navigation, durable deep links]
    needs:
      - Find the applicable practice guide, form, fee and digital route.
      - Check processing, requisition, application and expedite guidance.
    risks:
      - Using an obsolete form, fee or portal workflow.
      - Mistaking an aggregate processing estimate for an application guarantee.
    evidence_refs: [EV-PRO-GUIDANCE, EV-PRACTICE-GUIDES]
  - id: USER-LENDER
    role: Lender, portfolio manager or mortgage-service user
    context: Using HMLR lender and commercial services.
    authority_requirement: Product scope, access agreement, fees and current service documentation must remain explicit.
    accessibility_language_needs: [Clear comparison tables and exportable metadata]
    needs:
      - Find charge, data-sync, portfolio and polygon services.
      - Distinguish guidance, portal functions and machine interfaces.
    risks:
      - Assuming a discovery record grants service access or data-reuse rights.
    evidence_refs: [EV-PRO-GUIDANCE, EV-BG-DOCS]
  - id: USER-DATA
    role: Data analyst, researcher, journalist or GIS specialist
    context: Selecting public or licensed land and property data for analysis.
    authority_requirement: Dataset scope, exclusions, cadence, format, licence, attribution and quality caveats must come from publisher sources.
    accessibility_language_needs: [Machine-readable metadata, accessible tables, non-map alternative]
    needs:
      - Compare PPD, UK HPI, ownership, transaction, requisition and spatial datasets.
      - Inspect source-native identifiers, CRS, temporal coverage and distribution types.
    risks:
      - Treating latest-month PPD or provisional UK HPI as complete or final.
      - Treating an index polygon as a legal boundary.
      - Redistributing bespoke-licensed or third-party address data.
    evidence_refs: [EV-PUBLIC-DATA, EV-ULPD, EV-INSPIRE-DATA]
  - id: USER-DEVELOPER
    role: Case-management or data-platform software engineer
    context: Evaluating HMLR APIs and integration contracts.
    authority_requirement: Current publisher documentation, protocol, schema version, environment and authentication requirements must be inspectable.
    accessibility_language_needs: [Copyable endpoints, schemas and error-state documentation]
    needs:
      - Find the correct Business Gateway, ULPD or linked-data interface.
      - Distinguish REST, SOAP/WSDL, test, production, public and restricted access.
    risks:
      - Copying stale catalogue endpoints or example dates as current facts.
      - Exposing credentials or signed download URLs.
    evidence_refs: [EV-BG-DOCS, EV-ULPD-API]
  - id: USER-LOCAL-AUTHORITY
    role: Local-authority or originating-authority Local Land Charges officer
    context: Migration, maintenance and search responsibilities across changing coverage.
    authority_requirement: Current migration table, formal guidance, fees and supplier/API boundaries must be visible.
    accessibility_language_needs: [Welsh route where applicable, durable authority-specific links]
    needs:
      - Determine whether an authority has migrated and which HMLR process applies.
      - Find originating-authority guidance and service boundaries.
    risks:
      - Assuming nationwide LLC coverage.
      - Treating LLC search as a replacement for CON29 enquiries.
    evidence_refs: [EV-LLC-PROGRAMME, EV-LLC-TERMS]
  - id: USER-AUDITOR
    role: Provenance, licensing, accessibility or service assessor
    context: Checking whether the derived catalogue makes supportable claims.
    authority_requirement: Every claim needs source, observation, derivation, rights and release state.
    accessibility_language_needs: [WCAG 2.2 AA target, text alternatives, reduced motion, high contrast]
    needs:
      - Trace a normalized record to publisher evidence.
      - Identify unknown, restricted, stale, partial and unverified states.
    risks:
      - Automated checks being presented as legal, statistical or accessibility assurance.
    evidence_refs: [EV-ACCESSIBILITY, EV-PERSONAL-INFO, EV-OKF-AUTHORING]

tasks:
  - id: TASK-PUBLIC-ROUTE
    user_ids: [USER-PUBLIC]
    goal: Find the authoritative service or guidance route and understand its product, cost and evidential limits.
    context: Public property-information and registration discovery.
    authority_requirement: Current GOV.UK and HMLR service evidence.
    required_evidence: [Canonical official URL, scope, access requirement, cost volatility, official-copy distinction]
    freshness_tolerance: Revalidate at time of action; fees and service state are volatile.
    likely_confusions: [Property summary versus title register, downloaded copy versus official copy, general versus exact boundary]
    consequences_of_error: [Legal or financial reliance on the wrong product]
    hard_failures: [The bundle states or implies ownership, an exact boundary or legal advice.]
    success: The user reaches the official route with the material warning visible before action.
  - id: TASK-PRACTICE
    user_ids: [USER-PROFESSIONAL, USER-LENDER]
    goal: Find the current practice guide, form, fee, notice and digital route for a registration task.
    context: Professional application preparation.
    authority_requirement: Formal current guidance and notices outrank older summaries.
    required_evidence: [Document type, source route, publisher date, related collection]
    freshness_tolerance: Revalidate before submission.
    likely_confusions: [Older portal guidance versus current DRS coverage, publication date versus last update]
    consequences_of_error: [Rejected, delayed or incorrectly charged application]
    hard_failures: [An obsolete or superseded route is labelled current without warning.]
    success: The result exposes the formal source, date and related alternatives.
  - id: TASK-DATASET
    user_ids: [USER-DATA, USER-AUDITOR]
    goal: Select a dataset by purpose, coverage, cadence, format, licence and access model.
    context: Dataset discovery and reuse assessment.
    authority_requirement: Publisher-operated dataset and licence pages.
    required_evidence: [Dataset scope, exclusions, release cadence, distribution type, access, licence, attribution]
    freshness_tolerance: Snapshot metadata may guide discovery; live publisher state must be checked before reuse.
    likely_confusions: [Free versus open, catalogue modified versus release date, full versus delta, snapshot versus live register]
    consequences_of_error: [Invalid analysis, licence breach or misleading publication]
    hard_failures: [A mixed or bespoke licence is flattened to OGL, or catalogue dates are labelled as data currency.]
    success: The user can compare material differences and open the canonical publisher source.
  - id: TASK-SPATIAL
    user_ids: [USER-DATA, USER-PUBLIC]
    goal: Find the appropriate spatial product and interpret its coverage, CRS and boundary meaning safely.
    context: INSPIRE, National Polygon and title-plan discovery.
    authority_requirement: HMLR dataset technical guidance and product terms.
    required_evidence: [Freehold/leasehold coverage, indicative status, CRS, cadence, licence and attribution]
    freshness_tolerance: Monthly snapshot with visible release date.
    likely_confusions: [Title plan versus index polygon, EPSG:27700 versus web CRS, indicative versus exact]
    consequences_of_error: [Incorrect spatial or legal conclusion]
    hard_failures: [The bundle calls an indicative polygon an exact legal boundary.]
    success: The product is discoverable with a non-map explanation and explicit limitation.
  - id: TASK-API
    user_ids: [USER-DEVELOPER, USER-LENDER]
    goal: Identify the correct machine interface, contract, environment and onboarding requirement.
    context: Business Gateway, dataset API and linked-data integration.
    authority_requirement: Current publisher documentation and formal service notice.
    required_evidence: [Protocol, documentation, schema/version, test/production distinction, authentication, access]
    freshness_tolerance: Revalidate immediately before integration.
    likely_confusions: [REST versus SOAP, public documentation versus public operation, example endpoint versus current endpoint]
    consequences_of_error: [Failed integration, security exposure or unauthorised call]
    hard_failures: [A credential is stored, or a restricted service is described as anonymous.]
    success: A developer reaches the official contract without the bundle attempting execution.
  - id: TASK-LLC
    user_ids: [USER-LOCAL-AUTHORITY, USER-PUBLIC, USER-PROFESSIONAL]
    goal: Determine the Local Land Charges route, migration coverage and boundary with CON29.
    context: LLC search, migration and maintenance.
    authority_requirement: Current programme page, service terms and PG79.
    required_evidence: [Authority migration status, search type, fee/access, originating authority, CON29 exclusion]
    freshness_tolerance: Revalidate at time of search or migration action.
    likely_confusions: [Land Charges versus Local Land Charges, personal versus official search, LLC versus CON29]
    consequences_of_error: [Incomplete conveyancing search or wrong authority process]
    hard_failures: [The bundle claims nationwide coverage or automates the restricted search service.]
    success: The user can identify the official route and visible scope boundary.
  - id: TASK-AUDIT
    user_ids: [USER-AUDITOR]
    goal: Verify source authority, derivation, freshness, rights, coverage and accessibility claims.
    context: Publication assurance.
    authority_requirement: Machine-readable provenance plus direct publisher evidence.
    required_evidence: [Source URL, observed time, source date, derivation, rights state, denominator, validation receipt]
    freshness_tolerance: Bound to the frozen snapshot and candidate digest.
    likely_confusions: [Official source versus official endorsement, automated pass versus independent assurance]
    consequences_of_error: [Unsupported trust or completeness claim]
    hard_failures: [An unknown or untested state is relabelled passed.]
    success: Every sampled claim resolves to evidence and unsupported claims fail closed.

